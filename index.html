<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电鳗骑自行车 · SVG 2D 动画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13 2L4 14h6l-1 8 9-12h-6z' fill='%23ffd60a'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #1d3055 0%, #0c1424 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    padding: 26px 16px; color: #e8f0ff;
  }
  h1 { font-size: clamp(18px, 3.2vw, 26px); font-weight: 700; letter-spacing: 3px; }
  .sub { font-size: 13px; color: #9fb4d4; margin: 8px 0 18px; letter-spacing: 1px; }
  .stage {
    width: 100%; max-width: 960px; background: #fff;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.08) inset;
  }
  svg { display: block; width: 100%; height: auto; }
  .foot { margin-top: 14px; font-size: 12px; color: #7e93b8; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>电鳗骑自行车</h1>
  <p class="sub">纯内联 SVG + SMIL · 2D 循环动画</p>
  <div class="stage">
    <svg viewBox="0 0 900 540" role="img" aria-label="卡通电鳗骑自行车的2D动画" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <!-- 天空 -->
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a8dcf7"/>
          <stop offset="1" stop-color="#eaf7ff"/>
        </linearGradient>
        <!-- 电鳗身体 -->
        <linearGradient id="eelBody" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#14244d"/>
          <stop offset=".55" stop-color="#2a4a85"/>
          <stop offset="1" stop-color="#4a7bb0"/>
        </linearGradient>
        <!-- 电鳗头部 -->
        <radialGradient id="eelHead" cx="0.35" cy="0.3" r="0.9">
          <stop offset="0" stop-color="#4a7bb0"/>
          <stop offset=".6" stop-color="#27407e"/>
          <stop offset="1" stop-color="#16224a"/>
        </radialGradient>
        <!-- 太阳光晕 -->
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
          <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
        </radialGradient>
        <!-- 发光滤镜 -->
        <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- 闪电符号 -->
        <path id="bolt" d="M2,-14 L-7,2 L-1,2 L-4,14 L8,-2 L2,-2 Z" fill="#ffe34d" stroke="#ffb703" stroke-width="1.2"/>
        <!-- 云朵形状 -->
        <g id="cloudShape">
          <ellipse cx="0" cy="0" rx="42" ry="24"/>
          <ellipse cx="34" cy="6" rx="32" ry="20"/>
          <ellipse cx="-32" cy="8" rx="28" ry="17"/>
          <rect x="-42" y="0" width="80" height="22" rx="10"/>
        </g>
      </defs>

      <!-- ===== 背景层 ===== -->
      <rect x="0" y="0" width="900" height="540" fill="url(#sky)"/>
      <circle cx="140" cy="110" r="72" fill="url(#sunGlow)"/>
      <circle cx="140" cy="110" r="40" fill="#ffe98a"/>

      <!-- 云（从右向左漂移） -->
      <g fill="#ffffff">
        <g opacity=".95">
          <use href="#cloudShape" xlink:href="#cloudShape"/>
          <animateTransform attributeName="transform" type="translate" values="960,86;-220,86" dur="24s" repeatCount="indefinite" calcMode="linear"/>
        </g>
        <g opacity=".85">
          <use href="#cloudShape" xlink:href="#cloudShape" transform="scale(.7)"/>
          <animateTransform attributeName="transform" type="translate" values="960,160;-220,160" dur="34s" begin="-12s" repeatCount="indefinite" calcMode="linear"/>
        </g>
        <g opacity=".9">
          <use href="#cloudShape" xlink:href="#cloudShape" transform="scale(.85)"/>
          <animateTransform attributeName="transform" type="translate" values="960,130;-220,130" dur="28s" begin="-20s" repeatCount="indefinite" calcMode="linear"/>
        </g>
      </g>

      <!-- 远山 -->
      <path d="M0,468 L0,418 Q110,358 220,400 Q330,348 450,395 Q570,345 690,395 Q800,355 900,400 L900,468 Z" fill="#a9cfa0"/>
      <path d="M0,468 L0,442 Q150,402 300,436 Q450,396 600,436 Q750,402 900,440 L900,468 Z" fill="#8fbd84"/>

      <!-- 地面 -->
      <rect x="0" y="468" width="900" height="72" fill="#7cb861"/>
      <line x1="0" y1="468" x2="900" y2="468" stroke="#68a852" stroke-width="4"/>
      <!-- 向后滚动的草纹（与轮子同周期） -->
      <g stroke="#5d9d47" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="490" x2="900" y2="490" stroke-dasharray="34 36">
          <animate attributeName="stroke-dashoffset" values="0;-560" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
        </line>
        <line x1="0" y1="514" x2="900" y2="514" stroke-dasharray="34 36">
          <animate attributeName="stroke-dashoffset" values="0;-560" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
        </line>
        <line x1="0" y1="536" x2="900" y2="536" stroke-dasharray="34 36">
          <animate attributeName="stroke-dashoffset" values="0;-560" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
        </line>
      </g>
      <!-- 小花 -->
      <g fill="#fff6b0">
        <circle cx="120" cy="500" r="3"/><circle cx="380" cy="522" r="3"/>
        <circle cx="640" cy="502" r="3"/><circle cx="800" cy="524" r="3"/>
      </g>

      <!-- 速度线 -->
      <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
        <line x1="118" y1="212" x2="182" y2="212">
          <animate attributeName="opacity" values="0;.9;.2;0" keyTimes="0;.3;.6;1" dur=".9s" repeatCount="indefinite"/>
        </line>
        <line x1="88" y1="282" x2="176" y2="282">
          <animate attributeName="opacity" values="0;.9;.2;0" keyTimes="0;.3;.6;1" dur=".9s" begin="-.45s" repeatCount="indefinite"/>
        </line>
        <line x1="128" y1="342" x2="200" y2="342">
          <animate attributeName="opacity" values="0;.9;.2;0" keyTimes="0;.3;.6;1" dur=".9s" begin="-.2s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- ===== 骑行主体（整体颠簸） ===== -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" keyTimes="0;.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="0.6s" repeatCount="indefinite"/>

        <!-- 后轮 -->
        <g transform="translate(300,380)">
          <circle r="90" fill="#26262a"/>
          <circle r="76" fill="#f3f4f6"/>
          <circle r="76" fill="none" stroke="#c3c8d0" stroke-width="3"/>
          <g stroke="#aab0bc" stroke-width="2.5">
            <line x1="0" y1="0" x2="0" y2="-74"/>
            <line x1="0" y1="0" x2="64" y2="-37"/>
            <line x1="0" y1="0" x2="64" y2="37"/>
            <line x1="0" y1="0" x2="0" y2="74"/>
            <line x1="0" y1="0" x2="-64" y2="37"/>
            <line x1="0" y1="0" x2="-64" y2="-37"/>
          </g>
          <circle r="8" fill="#3a3f4a"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
        </g>

        <!-- 前轮 -->
        <g transform="translate(600,380)">
          <circle r="90" fill="#26262a"/>
          <circle r="76" fill="#f3f4f6"/>
          <circle r="76" fill="none" stroke="#c3c8d0" stroke-width="3"/>
          <g stroke="#aab0bc" stroke-width="2.5">
            <line x1="0" y1="0" x2="0" y2="-74"/>
            <line x1="0" y1="0" x2="64" y2="-37"/>
            <line x1="0" y1="0" x2="64" y2="37"/>
            <line x1="0" y1="0" x2="0" y2="74"/>
            <line x1="0" y1="0" x2="-64" y2="37"/>
            <line x1="0" y1="0" x2="-64" y2="-37"/>
          </g>
          <circle r="8" fill="#3a3f4a"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
        </g>

        <!-- 车架 -->
        <g fill="none" stroke-linecap="round">
          <g stroke="#d6404a" stroke-width="10">
            <line x1="300" y1="380" x2="450" y2="380"/>
            <line x1="300" y1="380" x2="355" y2="268"/>
            <line x1="355" y1="268" x2="615" y2="252"/>
            <line x1="450" y1="380" x2="615" y2="252"/>
            <line x1="355" y1="268" x2="450" y2="380"/>
          </g>
          <line x1="615" y1="252" x2="600" y2="380" stroke="#444b58" stroke-width="10"/>
          <line x1="585" y1="252" x2="645" y2="252" stroke="#2b2f38" stroke-width="9"/>
          <line x1="585" y1="242" x2="585" y2="258" stroke="#2b2f38" stroke-width="7"/>
          <line x1="645" y1="242" x2="645" y2="258" stroke="#2b2f38" stroke-width="7"/>
          <ellipse cx="355" cy="261" rx="27" ry="9" fill="#2b2f38" stroke="none"/>
        </g>

        <!-- 尾巴（垂向中轴） -->
        <path d="M355,270 C395,305 415,348 450,378" fill="none" stroke="#2a4a85" stroke-width="38" stroke-linecap="round"/>

        <!-- 曲柄 / 踏板 / 蹬腿 -->
        <g transform="translate(450,380)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
            <!-- 踏板（反向旋转保持水平） -->
            <g transform="translate(44,0)">
              <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#1d2027"/>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
            </g>
            <g transform="translate(-44,0)">
              <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#1d2027"/>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
            </g>
            <!-- 两条尾巴腿 -->
            <line x1="0" y1="0" x2="44" y2="0" stroke="#2a4a85" stroke-width="15" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="-44" y2="0" stroke="#253f74" stroke-width="15" stroke-linecap="round"/>
            <ellipse cx="44" cy="0" rx="12" ry="9" fill="#4a7bb0"/>
            <ellipse cx="-44" cy="0" rx="12" ry="9" fill="#3f6ea5"/>
          </g>
          <circle r="11" fill="#3a3f4a" stroke="#222" stroke-width="2"/>
        </g>

        <!-- 电鳗上半身（随骑行轻摆） -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-1.6 355 268;1.6 355 268;-1.6 355 268" dur="1.2s" repeatCount="indefinite"/>

          <!-- 身体 -->
          <path id="bodyPath" d="M355,268 C290,235 300,160 375,145 C450,130 480,150 510,165 C535,176 548,180 552,182" fill="none" stroke="url(#eelBody)" stroke-width="42" stroke-linecap="round"/>
          <!-- 腹侧浅色 -->
          <path d="M355,268 C290,235 300,160 375,145 C450,130 480,150 510,165 C535,176 548,180 552,182" fill="none" stroke="#c3dcef" stroke-width="13" stroke-linecap="round" transform="translate(9,11)"/>

          <!-- 沿身体流动的电流光点 -->
          <g filter="url(#glow)">
            <circle r="4.5" fill="#fff3b0">
              <animateMotion dur="1.4s" repeatCount="indefinite" begin="0s"><mpath href="#bodyPath" xlink:href="#bodyPath"/></animateMotion>
            </circle>
            <circle r="3.5" fill="#ffe34d">
              <animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.47s"><mpath href="#bodyPath" xlink:href="#bodyPath"/></animateMotion>
            </circle>
            <circle r="3" fill="#fff3b0">
              <animateMotion dur="1.4s" repeatCount="indefinite" begin="-0.94s"><mpath href="#bodyPath" xlink:href="#bodyPath"/></animateMotion>
            </circle>
          </g>

          <!-- 握车把的鳍 -->
          <path d="M492,170 C528,192 562,226 583,250" fill="none" stroke="#2a4a85" stroke-width="15" stroke-linecap="round"/>
          <path d="M514,158 C560,186 604,220 645,250" fill="none" stroke="#253f74" stroke-width="15" stroke-linecap="round"/>
          <circle cx="583" cy="250" r="8" fill="#2a4a85"/>
          <circle cx="645" cy="250" r="8" fill="#253f74"/>

          <!-- 头 -->
          <g transform="translate(552,182)">
            <animateTransform attributeName="transform" type="rotate" values="-2 10 -8;2 10 -8;-2 10 -8" dur="1.2s" repeatCount="indefinite" additive="sum"/>
            <ellipse cx="10" cy="-8" rx="44" ry="37" fill="url(#eelHead)"/>
            <ellipse cx="14" cy="8" rx="28" ry="20" fill="#b9d7ea"/>
            <ellipse cx="18" cy="6" rx="8" ry="5" fill="#ff9e9e" opacity=".55"/>
            <!-- 眼睛（周期眨眼） -->
            <g transform="translate(26,-18)">
              <g>
                <animateTransform attributeName="transform" type="scale" values="1;1;0.08;1" keyTimes="0;.86;.93;1" dur="3.4s" repeatCount="indefinite"/>
                <ellipse rx="11" ry="13" fill="#fff" stroke="#16224a" stroke-width="2"/>
                <circle cx="3" cy="1" r="7" fill="#16224a"/>
                <circle cx="5" cy="-2" r="2.6" fill="#fff"/>
              </g>
            </g>
            <!-- 眉毛 / 嘴 / 鼻孔 -->
            <path d="M18,-30 Q26,-35 34,-30" fill="none" stroke="#16224a" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M22,8 Q34,20 50,8" fill="none" stroke="#16224a" stroke-width="3" stroke-linecap="round"/>
            <circle cx="46" cy="-4" r="2" fill="#16224a"/>
          </g>

          <!-- 电火花 -->
          <g filter="url(#glow)">
            <use href="#bolt" xlink:href="#bolt" transform="translate(300,150) scale(1.3)">
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.35;1" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/>
            </use>
            <use href="#bolt" xlink:href="#bolt" transform="translate(420,102) scale(1)">
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.35;1" dur="0.9s" begin="-0.5s" repeatCount="indefinite"/>
            </use>
            <use href="#bolt" xlink:href="#bolt" transform="translate(624,118) scale(.9)">
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.35;1" dur="1.3s" begin="-0.8s" repeatCount="indefinite"/>
            </use>
            <use href="#bolt" xlink:href="#bolt" transform="translate(250,212) scale(.8)">
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.35;1" dur="0.8s" begin="-0.3s" repeatCount="indefinite"/>
            </use>
          </g>
        </g>
      </g>
    </svg>
  </div>
  <p class="foot">轮组转动 · 踏板蹬圈 · 电流沿身体流动 · 眨眼与电火花 · 云朵草地后移</p>
</body>
</html>
